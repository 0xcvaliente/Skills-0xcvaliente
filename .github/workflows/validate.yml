name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills
        run: python3 scripts/validate.py
      - name: Document skill tests (standard library only)
        run: python3 -m unittest discover -s skills/documents/tests
      - name: Install document libraries and rerun with starters
        run: |
          python3 -m pip install python-docx openpyxl python-pptx reportlab pypdf pillow
          python3 -m unittest discover -s skills/documents/tests
