<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620" role="img" aria-labelledby="dc-0d225c179a-title dc-0d225c179a-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="dc-0d225c179a-title">From request to background work</title>
<desc id="dc-0d225c179a-desc">The API writes the record synchronously, then publishes queued work. A worker processes the queue; completion notifications are proposed.</desc>
