<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1180" width="1480" height="1180" role="img" aria-labelledby="order-title order-desc">
<title id="order-title">Order flow: authorization, acceptance and asynchronous fulfilment</title>
<desc id="order-desc">Time runs downward through Browser, API, Database, Queue, Worker and Fulfilment lanes. Authorization denial returns 403 and ends the path. The allowed branch stores an order, publishes a job and returns 202 before the later queued phase. The worker calls fulfilment, then records complete on success or failed on failure. State updates are shown as worker self-actions because their storage target is unspecified. Retry policy is unknown.</desc>
